version: '3.8'

services:
  # MongoDB
  mongodb:
    image: mongo:7
    container_name: ids-mongodb
    restart: unless-stopped
    # Port NOT exposed to host — only accessible within Docker network
    # Uncomment for local development debugging only:
    # ports:
    #   - "127.0.0.1:27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:?Set MONGO_USER in .env}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASS:?Set MONGO_PASS in .env}
      MONGO_INITDB_DATABASE: ids_db
    volumes:
      - mongo_data:/data/db
    networks:
      - ids-network
    healthcheck:
      test: [ "CMD", "mongosh", "--eval", "db.adminCommand('ping')" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # ML Service (Python/FastAPI)
  ml-service:
    build:
      context: ./ml-service
      dockerfile: Dockerfile
    container_name: ids-ml-service
    restart: unless-stopped
    # Port NOT exposed to host — backend reaches it via Docker network
    # Uncomment for local development debugging only:
    # ports:
    #   - "127.0.0.1:8000:8000"
    volumes:
      - ./ml-service/models:/app/models:ro
    environment:
      - PYTHONUNBUFFERED=1
    networks:
      - ids-network
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/health" ]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Backend (Node.js/Express)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ids-backend
    restart: unless-stopped
    # In production, Nginx proxies to backend via Docker network.
    # Bind to localhost only for local dev access:
    ports:
      - "127.0.0.1:5000:5000"
    depends_on:
      mongodb:
        condition: service_healthy
      ml-service:
        condition: service_healthy
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGO_URI=mongodb://${MONGO_USER:?Set MONGO_USER in .env}:${MONGO_PASS:?Set MONGO_PASS in .env}@mongodb:27017/ids_db?authSource=admin
      - JWT_SECRET=${JWT_SECRET:?Set JWT_SECRET in .env}
      - ML_SERVICE_URL=http://ml-service:8000
      - CORS_ORIGIN=http://localhost
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - ALERT_EMAIL=${ALERT_EMAIL:-}
    networks:
      - ids-network
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:5000/api/v1/health" ]
      interval: 10s
      timeout: 5s
      retries: 3

  # Frontend (React — built & served by Nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ids-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - ids-network

volumes:
  mongo_data:

networks:
  ids-network:
    driver: bridge
